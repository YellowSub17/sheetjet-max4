[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sheetjet-max4"
version = "0.1.0"
description = "Masks, flat field and per-frame powder patterns for liquid-sheet-jet data from the JUNGFRAU 9M at MAX IV"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "scipy",
    "h5py",
    "hdf5plugin",   # bitshuffle/LZ4 filters for the JUNGFRAU data files
    "matplotlib",
]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["const", "rundata"]
